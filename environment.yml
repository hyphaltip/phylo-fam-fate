# Command-line toolchain for phylo-fam-fate (cli/famfate.sh).
# Versions are pinned to what the browser runs, so CLI and web results match:
#   BLAST+ 2.17.0, HMMER 3.4, MUSCLE 5.1.0, FastTree 2.1.11 (same as the site);
#   Kalign 3.3.2 (the site runs 3.3.1, which bioconda doesn't carry).
# BLAST+ 2.17.0 is linux-64/osx only on bioconda, so this environment and the
# container are x86-64 (Apple Silicon: osx-arm64 works natively for conda).
name: famfate
channels:
  - conda-forge
  - bioconda
dependencies:
  - blast=2.17.0
  - hmmer=3.4
  - kalign3=3.3.2
  - muscle=5.1.0
  - fasttree=2.1.11
  - trimal
  - seqkit
  - nodejs>=20
  - curl
  - jq
  - gawk
  - gzip
